<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConnectFlow</title>
  </head>
  <body>
    <div class="plugin-container">

			<div class="color-input">
				<div class="color-input__color">
					<div id="colorPreview" class="color-input__preview"></div>
					<input id="colorInput" class="input input--color" type="text" pattern="[0-9a-fA-F]{6}" maxlength="6">
				</div>
				<div class="color-input__opacity">
					<input id="opacityInput" class="input input--opacity" type="number" max="100" min="0">
				</div>
			</div>

      <div class="stroke-row">
        <div class="stroke-width">
          <div class="stroke-icon">≡</div>
          <input id="strokeInput" type="number" class="stroke-input" min="1" max="100" value="2">
        </div>
        <select id="connectorTypeSelect" class="dropdown" data-setting="connectorType">
          <option value="direct" selected>Direct</option>
          <option value="orthogonal">Orthogonal</option>
          <option value="curve">Curve</option>
        </select>
        <select id="styleSelect" class="dropdown" data-setting="style">
          <option value="solid" selected>Solid</option>
          <option value="dashed">Dashed</option>
          <option value="dotted">Dotted</option>
          <option value="mixed">Mixed</option>
        </select>
      </div>

      <div class="arrow-row">
        <select id="startCapSelect" class="dropdown arrow-start" data-setting="startArrow">
          <option value="none" selected>None</option>
          <option value="line-arrow">Arrow</option>
          <option value="triangle-arrow">Triangle</option>
          <option value="square-marker">Rect</option>
          <option value="circle-marker">Circle</option>
          <option value="diamond-marker">Diamond</option>
          <option value="round">Rounded</option>
          <option value="square">Squared</option>
        </select>
        <div class="arrow-direction">
          <span class="arrow-icon">→</span>
        </div>
        <select id="endCapSelect" class="dropdown arrow-end" data-setting="endArrow">
          <option value="none" selected>None</option>
          <option value="line-arrow">Arrow</option>
          <option value="triangle-arrow">Triangle</option>
          <option value="square-marker">Rect</option>
          <option value="circle-marker">Circle</option>
          <option value="diamond-marker">Diamond</option>
          <option value="round">Rounded</option>
          <option value="square">Squared</option>
        </select>
        <div class="offset-control">
          <div class="offset-icon">↔</div>
          <input id="offsetInput" type="number" class="offset-input" min="0" max="200" value="0">
        </div>
      </div>

      <div class="preview-container">
        <div class="preview-element left">
          <div class="anchor-point top" data-side="t"></div>
          <div class="anchor-point right" data-side="r"></div>
          <div class="anchor-point bottom" data-side="b"></div>
          <div class="anchor-point left" data-side="l"></div>
          <span class="preview-text">Select an element</span>
        </div>
        <div class="connector-arrow">→</div>
        <div class="preview-element right">
          <div class="anchor-point top" data-side="t"></div>
          <div class="anchor-point right" data-side="r"></div>
          <div class="anchor-point bottom" data-side="b"></div>
          <div class="anchor-point left" data-side="l"></div>
          <span class="preview-text">then another element holding [Shift]</span>
        </div>
      </div>

      <div class="controls-section">
        <label class="switch-container">
          <input type="checkbox" class="checkbox-hidden" aria-labelledby="drawOnSelectionInputLabel" id="drawOnSelectionInput">
          <span class="switch-slider"></span>
        </label>
        <label for="drawOnSelectionInput" id="drawOnSelectionInputLabel" class="body-m">Draw on selection</label>
        <select class="dropdown" data-setting="selectionType">
          <option value="connector" selected>Connector</option>
          <option value="maintain">Maintain</option>
          <option value="start">Start</option>
          <option value="end">End</option>
        </select>
        <button id="generateButton" type="button" data-appearance="primary" data-handler="generate-connector">
          GENERATE
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
